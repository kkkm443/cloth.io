# Demo deployment only. Free instances do not persist the SQLite database.
# Upload all project files to your repo root, then Render > New > Blueprint.
services:
  - type: web
    name: clothing-keeper-mvp
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/config
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: RETENTION_DAYS
        value: "7"
      - key: INTAKE_AUTHORIZED
        value: "false"
      - key: GOVERNMENT_CONNECTOR_VERIFIED
        value: "false"
