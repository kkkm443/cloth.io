<script>
'use strict';
const ICONS={leaf:'M20 4c-8-1-15 3-15 9a6 6 0 0 0 6 6c6 0 10-7 9-15ZM4 21l11-11',camera:'M14 4h-4L8 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-4l-2-3Zm-2 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8',upload:'M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5',arrow:'M5 12h14m-6-6 6 6-6 6',back:'M19 12H5m6-6-6 6 6 6',pin:'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Zm-8-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6',file:'M14 2H5v20h14V7l-5-5Zm0 0v6h5M8 12h8M8 16h8',check:'m5 12 4 4L19 6',shield:'m12 2 9 4v6c0 6-9 10-9 10S3 18 3 12V6l9-4Zm-4 10 3 3 5-6',building:'M3 22V8l9-5 9 5v14M8 22V12m8 10V12M1 22h22M8 8h8',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7',history:'M3 3v6h6M4 8a9 9 0 1 1-1 9m9-11v6l4 2',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 2h6l1 3 3 1 3 3v6l-3 3-3 1-1 3H9l-1-3-3-1-3-3V9l3-3 3-1 1-3',copy:'M8 8h13v13H8V8Zm-4 8H2V2h14v2',download:'M12 3v12m-5-5 5 5 5-5M4 17v5h16v-5',external:'M14 3h7v7m0-7L10 14M10 3H3v18h18v-7',info:'M12 8v1m0 3v5M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',phone:'M8 3H3v5c0 7 6 13 13 13h5v-5l-5-2-2 2-6-6 2-2-2-5',plus:'M12 5v14M5 12h14',refresh:'M20 3v6h-6M4 21v-6h6M3 10a9 9 0 0 1 15-7l2 6M4 15l2 6a9 9 0 0 0 15-7',lock:'M6 10V7a6 6 0 0 1 12 0v3M4 10h16v12H4V10Zm8 5v3',edit:'m15 3 6 6-12 12H3v-6L15 3Zm-3 3 6 6',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]||ICONS.info}"/></svg>`;
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=(u)=>{try{const x=new URL(u);return x.protocol==='https:'?esc(x.href):'#';}catch{return '#';}};
const uid=()=>globalThis.crypto?.randomUUID?.().replaceAll('-','')||Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const LABELS={normal:'정상',overflow:'포화',dumping:'주변 투기물 발생',damage:'파손',no_label:'관리자 표시 확인 어려움',uncertain:'판단 어려움'};
const WEIGHTS={normal:5,overflow:35,dumping:35,damage:40,no_label:10,uncertain:0};
const OFFICIAL='https://www.safetyreport.go.kr/?menuCd=FN1210';
const SOURCE='https://www.gwangjin.go.kr/portal/main/contents.do?menuNo=201332';
const STORAGE='clothing-keeper-v2-local';
const S={page:'start',config:{server:false,ai_enabled:false,intake:{enabled:false},retention_days:7},loadingConfig:true,offline:location.protocol==='file:'||new URLSearchParams(location.search).get('demo')==='1',error:'',mode:'manual',image:'',filename:'',sample:false,region:'서울특별시 광진구',location:'',notes:'',selected:[],aiConsent:false,draft:null,receipt:null,history:[],busy:false,idempotency:uid(),adminToken:'',adminReports:[],ready:false};
function date(v){try{return new Date(v).toLocaleString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function pill(text,kind=''){return `<span class="pill ${kind}"><span class="dot"></span>${esc(text)}</span>`;}
function toast(text){const el=document.getElementById('notifications');el.innerHTML=`<div class="toast">${esc(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.innerHTML='';},4000);}
function error(text){S.error=text;render();document.getElementById('error')?.scrollIntoView({behavior:'smooth',block:'center'});}
function busy(on,title='내용을 준비하고 있어요',text='현재 작업이 끝나면 다음 화면으로 이동합니다.'){S.busy=on;document.getElementById('busy')?.remove();if(on){const el=document.createElement('div');el.id='busy';el.className='busy-overlay';el.setAttribute('role','status');el.innerHTML=`<div class="busy-box"><div class="spinner"></div><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;document.body.appendChild(el);}}
function readLocal(){try{const items=JSON.parse(localStorage.getItem(STORAGE)||'[]');const cutoff=Date.now()-7*86400000;const kept=Array.isArray(items)?items.filter(r=>r?.id&&new Date(r.created).getTime()>cutoff):[];if(Array.isArray(items)&&kept.length!==items.length)localStorage.setItem(STORAGE,JSON.stringify(kept));return kept;}catch{return [];}}
function saveLocal(items){try{localStorage.setItem(STORAGE,JSON.stringify(items.slice(0,100)));}catch{throw new Error('브라우저 저장 공간을 사용할 수 없습니다. 기록을 내려받거나 서버 실행 모드를 이용해 주세요.');}}
async function api(path,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),options.long?180000:40000);try{const res=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Keeper-Request':'1',...(options.headers||{})},signal:controller.signal});let data;try{data=await res.json();}catch{throw new Error('서버 응답을 읽을 수 없습니다. 서버 실행 상태를 확인해 주세요.');}if(!res.ok){throw new Error(typeof data.detail==='string'?data.detail:'입력값을 확인해 주세요.');}return data;}catch(e){if(e.name==='AbortError')throw new Error('서버 응답 시간이 초과되었습니다. 접수 중이었다면 내 접수 내역부터 확인해 주세요.');throw e;}finally{clearTimeout(timer);}}
function connection(){if(S.loadingConfig)return pill('연결 확인 중','gray');if(S.offline)return pill('로컬 체험 · 외부 전송 없음','warn');if(!S.ready)return pill('서버 연결 오류','red');return pill(S.config.ai_enabled?'AI 연결됨 · 서버 실행':'서버 실행 · 직접 상태 확인',S.config.ai_enabled?'':'gray');}
function layout(content){const current=['start','result','review','receipt'].includes(S.page)?'start':S.page;return `<aside class="sidebar"><button class="brand" onclick="go('start')" aria-label="수거함 지킴이 홈"><span class="brand-symbol">${icon('leaf')}</span><span class="brand-name">수거함 지킴이<small>CLOTHING KEEPER</small></span></button><div class="nav-label">WORKSPACE</div><nav class="nav" aria-label="주 메뉴"><button class="${current==='start'?'active':''}" onclick="go('start')" aria-label="새 제보">${icon('plus')}새 제보</button><button class="${current==='history'?'active':''}" onclick="openHistory()" aria-label="내 접수 내역">${icon('history')}내 접수 내역<span class="nav-count">${S.history.length}</span></button><button class="${current==='admin'?'active':''}" onclick="openAdmin()" aria-label="운영자">${icon('settings')}운영자</button></nav><div class="sidebar-bottom">${icon('shield')}<strong>작은 제보가 만드는 변화</strong><p>누구에게 연락할지 몰랐던 순간부터,<br>접수 내용을 확인하는 순간까지.</p><button class="text-btn mt16" onclick="privacy()">데이터 이용 안내 ${icon('external')}</button></div></aside><div class="app"><header class="topbar"><div class="crumb">우리 동네의 더 나은 일상<strong>/ ${current==='history'?'내 접수 내역':current==='admin'?'운영 관리':'새 제보'}</strong></div>${connection()}</header><main class="main">${S.error?`<div class="note error error-banner" id="error" role="alert">${icon('info')} ${esc(S.error)}</div>`:''}${content}<footer class="footer"><span>수거함 지킴이 · 사진에서 민원까지, 한 번에</span><span>AI 결과는 참고 정보입니다. 현장 확인이 필요합니다.</span></footer></main></div>`;}
function steps(active){const names=['사진<span class="optional">·위치</span>','진단<span class="optional">·부서</span>','민원 확인','접수 결과'];return `<div class="steps" aria-label="진행 단계">${names.map((n,i)=>`<div class="step ${i+1===active?'current':i+1<active?'done':''}" ${i+1===active?'aria-current="step"':''}><span class="num">${i+1<active?'✓':String(i+1).padStart(2,'0')}</span><span class="step-name">${n}</span></div>${i<3?'<div class="step-separator"></div>':''}`).join('')}</div>`;}
function sampleArt(){return `<div class="sample-art" aria-label="시연용 수거함 도식. 실제 현장 사진이 아닙니다."><svg viewBox="0 0 240 200" fill="none" aria-hidden="true"><ellipse cx="121" cy="177" rx="89" ry="10" fill="#dce5d8"/><path d="M65 54 153 39l31 22v107l-88 15-31-21V54Z" fill="#519376"/><path d="m65 54 31 21v108l-31-21V54Z" fill="#357c5c"/><path d="m65 54 88-15 31 22-88 14-31-21Z" fill="#8bb499"/><path d="m106 86 64-10v16l-64 10V86Z" fill="#265d47"/><path d="m109 117 54-8v29l-54 8v-29Z" fill="#e9eee1"/><path d="m124 119 6 4 7-6 12 9-6 7-4-3v10l-15 2v-10l-4 4-5-5 9-12Z" stroke="#5e8c71" stroke-width="2"/><path d="M43 139c-12 11-10 30 0 34 11 4 22-4 19-16l-8-18H43Z" fill="#c8d4ba"/><path d="m43 139 4-9 7 9" stroke="#95a683" stroke-width="3"/><path d="m169 143 10-10 11 5 13 23c4 13-23 19-28 12l-6-30Z" fill="#c4b995"/><path d="m176 134-2-5 11-3 5 12" stroke="#a79c78" stroke-width="3"/></svg><small>시연용 예시 · 실제 현장 사진이 아닙니다</small></div>`;}
function uploadBody(){if(S.sample)return sampleArt()+`<span class="image-change">${icon('camera')}사진으로 바꾸기</span>`;if(S.image)return `<img src="${S.image}" alt="선택한 수거함 사진"><span class="image-change">${icon('edit')}사진 바꾸기</span>`;return `<span class="upload-icon">${icon('camera')}</span><strong>수거함 사진을 올려주세요</strong><p>사진을 끌어다 놓거나 눌러서 선택하세요</p><span class="file-type">JPG, PNG, WEBP · 최대 10MB</span>`;}
function modeUI(){if(S.sample)return `<div class="note warn">${icon('info')} <strong>샘플 체험 중</strong><br>정해진 시나리오를 보여줍니다. 실제 사진 분석이나 기관 접수는 진행하지 않습니다.</div>`;return `<div class="field"><label>상태 확인 방식</label><div class="mode-options"><button type="button" class="mode-option ${S.mode==='manual'?'selected':''}" onclick="setMode('manual')">직접 상태 확인</button><button type="button" class="mode-option ${S.mode==='ai'?'selected':''}" ${!S.config.ai_enabled?'disabled':''} onclick="setMode('ai')">${icon('spark')} AI 사진 분석 ${!S.config.ai_enabled?'· 연결 필요':''}</button></div>${S.mode==='manual'?`<div class="checks">${Object.entries(LABELS).map(([k,v])=>`<label class="check-chip"><input type="checkbox" value="${k}" ${S.selected.includes(k)?'checked':''} onchange="toggleState('${k}',this.checked)"><span>${v}</span></label>`).join('')}</div><div class="helper">사진에서 직접 확인한 상태를 선택하세요. AI 분석 결과로 표시하지 않습니다.</div>`:`<label class="check-line"><input type="checkbox" ${S.aiConsent?'checked':''} onchange="S.aiConsent=this.checked"><span>사진을 AI 제공자(${esc(S.config.ai_provider_host||'연결된 서버')})에게 전송하는 데 동의합니다. 얼굴·차량번호는 먼저 가려주세요.</span></label>`}</div>`;}
function startPage(){return `<section class="hero"><div><div class="eyebrow">A SMALL ACTION. A BETTER NEIGHBORHOOD.</div><h1>그냥 지나치지 않도록,<br><span style="color:var(--green)">사진 한 장으로</span> 시작해요.</h1><p>수거함 상태 확인부터 담당 부서 안내, 민원 작성과 접수 관리까지.<br>복잡했던 신고 과정을 더 쉽게 연결합니다.</p></div><div class="hero-note"><div class="round-icon">${icon('leaf')}</div><strong class="small">우리 동네를 돌보는 작은 시작</strong><p>내가 남긴 한 장의 사진이<br>더 나은 일상의 첫걸음이 됩니다.</p></div></section>${steps(1)}<div class="grid"><section class="card card-pad"><div class="card-head"><div><div class="section-index">01 / START HERE</div><h2>어떤 수거함을 발견했나요?</h2><p class="sub">수거함과 주변이 함께 보이도록 찍어주세요.</p></div>${pill('새 제보','gray')}</div><form id="start-form" onsubmit="event.preventDefault();analyze()"><input id="file-input" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" onchange="loadFile(this.files[0])"><button type="button" class="upload-zone ${S.image||S.sample?'has-image':''}" id="drop-zone" onclick="document.getElementById('file-input').click()" aria-label="수거함 사진 선택">${uploadBody()}</button><div class="sample-row"><span class="inline-muted">${S.filename?esc(S.filename):'지금 사진이 없어도 괜찮아요.'}</span><button type="button" class="text-btn" onclick="useSample()">샘플로 체험하기 ${icon('arrow')}</button></div><div class="divider"></div><div class="fields-two"><div class="field"><label for="region">지역<span class="req">*</span></label><select id="region" onchange="changeRegion(this.value)"><option value="서울특별시 광진구" ${S.region==='서울특별시 광진구'?'selected':''}>서울특별시 광진구</option><option value="other" ${S.region!=='서울특별시 광진구'?'selected':''}>다른 지역 직접 입력</option></select></div><div class="field"><label for="location">동·상세 위치<span class="req">*</span></label><input class="input" id="location" placeholder="예: 자양동 ○○편의점 옆" value="${esc(S.location)}" maxlength="250" required oninput="S.location=this.value"></div></div>${S.region!=='서울특별시 광진구'?`<div class="field"><label for="other-region">시·군·구 입력</label><input class="input" id="other-region" placeholder="예: 서울특별시 ○○구" value="${esc(S.region==='other'?'':S.region)}" oninput="S.region=this.value" required><p class="helper">현재 공식 자료가 연결된 지역은 광진구입니다. 다른 지역은 담당 부서 확인이 필요합니다.</p></div>`:''}<div class="field"><label for="notes">추가로 알려주실 내용 <span class="inline-muted">선택</span></label><textarea id="notes" maxlength="1500" placeholder="예: 수거함 앞에 봉투가 쌓여 있어요. 개인 정보는 적지 말아주세요." oninput="S.notes=this.value">${esc(S.notes)}</textarea></div>${modeUI()}<div class="helper mb16">${S.offline?'사진은 이 페이지에서만 사용됩니다. 서버로 전송하지 않습니다.':`진행하면 사진과 입력 내용이 이 서비스에 최대 ${S.config.retention_days}일 저장됩니다. 불필요한 개인 정보가 없는 사진을 사용하세요.`} <button type="button" class="text-btn" onclick="privacy()">데이터 안내</button></div><button type="submit" class="btn primary full" ${S.loadingConfig||(!S.offline&&!S.ready)?'disabled':''}>${S.sample?'샘플 흐름 확인하기':S.mode==='ai'?'사진 분석하고 담당 부서 찾기':'상태 확인하고 담당 부서 찾기'} ${icon('arrow')}</button><div class="data-rail">${icon('lock')} 사진 메타데이터 제거 · 개인 연락처 입력 없음</div></form></section><aside class="aside-stack"><section class="card guide"><div class="eyebrow" style="margin-bottom:10px">HOW IT WORKS</div><h2>누구에게, 어떻게 연락할지<br>혼자 찾지 않아도 돼요.</h2><p>사진에서 접수 확인까지 이어지는 네 단계</p><div class="guide-list"><div class="guide-item"><span class="guide-icon">${icon('camera')}</span><div><strong>사진과 위치로 시작해요</strong><p>주변 상태와 위치를 한 번에 남겨주세요.</p></div></div><div class="guide-item"><span class="guide-icon">${icon('spark')}</span><div><strong>상태를 확인하고 담당 부서를 찾아요</strong><p>진단 근거와 공식 안내 출처를 함께 보여줘요.</p></div></div><div class="guide-item"><span class="guide-icon">${icon('file')}</span><div><strong>민원 내용은 자동으로 정리해요</strong><p>작성된 초안을 읽고 자유롭게 고칠 수 있어요.</p></div></div><div class="guide-item"><span class="guide-icon">${icon('check')}</span><div><strong>내가 확인한 후 접수해요</strong><p>서비스 접수와 기관 접수를 구분해 보여줘요.</p></div></div></div></section><section class="card card-pad pilot-card"><div class="card-head" style="margin-bottom:13px"><h3>현재 연결된 지역</h3>${pill('PILOT','gray')}</div><div class="department-row"><span class="department-icon">${icon('pin')}</span><div><strong style="font-size:14px">서울특별시 광진구</strong><p class="sub">구청 공식 안내 자료 기반</p></div></div><p class="sub">검증되지 않은 지역은 담당 부서를 임의로 추측하지 않아요.</p><a class="text-btn mt16" href="${SOURCE}" target="_blank" rel="noopener noreferrer">공식 자료 확인하기 ${icon('external')}</a></section><div class="note warn"><strong>${S.config.intake.enabled?'승인된 접수 연계가 설정되어 있어요.':'정부 자동 접수는 아직 연결되지 않았어요.'}</strong><br>${S.config.intake.enabled?`${esc(S.config.intake.name)}의 접수번호가 반환된 경우에만 외부 접수로 표시합니다.`:'현재는 서비스 내부 접수와 공식 신고 사이트 이동을 지원해요. 내부 접수는 정부 민원 접수가 아닙니다.'}</div></aside></div>`;}
function deptCard(d){return `<section class="card card-pad"><div class="card-head"><div><div class="section-index">DEPARTMENT MATCH</div><h2>담당 부서 안내</h2></div>${pill(d.verified?'공식 자료 확인':'확인 필요',d.verified?'':'warn')}</div><div class="department-row"><span class="department-icon">${icon('building')}</span><div><strong>${esc(d.department)}</strong><p class="sub">${esc(S.draft.region)}</p></div></div>${d.phone?`<a class="btn secondary full" href="tel:${esc(d.phone)}">${icon('phone')} ${esc(d.phone)}</a>`:''}<p class="sub mt16">${esc(d.guidance)}</p><div class="source"><details><summary>안내 근거와 자료 출처 보기</summary>${d.sources.map(s=>`<p><a href="${safeURL(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ${icon('external')}</a><br>${esc(s.excerpt)}<br>확인일: ${esc(s.checked)}</p>`).join('')||'<p>해당 지역의 자료가 아직 등록되지 않았습니다.</p>'}<p>${esc(d.retrieval)}</p><p>${esc(d.ordinance)}</p></details></div></section>`;}
function resultPage(){const d=S.draft;return `<div class="hero"><div><div class="eyebrow">02 / CHECK & CONNECT</div><h1 class="page-title">상태와 담당 부서를 확인해 주세요.</h1><p>확인된 내용을 바탕으로 민원 초안이 준비됐어요.</p></div></div>${steps(2)}<div class="grid"><section class="card card-pad"><div class="card-head"><h2>수거함 상태 확인</h2>${pill(d.mode==='demo'?'시연용 예시':d.mode==='ai'?'AI 사진 분석':'제보자 직접 확인',d.mode==='ai'?'':'gray')}</div>${S.sample?sampleArt():`<img class="result-photo" src="${S.image}" alt="진단에 사용한 수거함 사진">`}<div class="metrics"><div class="score ${d.score>=50?'attention':''}"><strong>${d.score===null?'—':d.score}</strong><small>참고 점수 / 100</small></div><div><h3>${d.states.includes('uncertain')?'현장 확인이 필요해요':d.score>=50?'관리 상태를 살펴봐 주세요':d.states.includes('normal')?'선택된 상태는 정상이에요':'확인이 필요한 상태예요'}</h3><div class="tag-row mt16">${d.states.map(k=>`<span class="tag ${d.score>=50?'warning':''}">${esc(LABELS[k])}</span>`).join('')}</div></div></div><div class="helper">${esc(d.score_note)}</div><ul class="observations">${d.observations.map(o=>`<li>${esc(o)}</li>`).join('')}</ul><div class="note warn mt24"><strong>현장 확인 필요</strong><br>사진만으로 실제 관리 책임이나 위법 여부를 판단하지 않아요. 상태가 다르게 보이면 이전 단계에서 수정해 주세요.</div></section><aside class="aside-stack">${deptCard(d.department)}<section class="card card-pad"><div class="section-index">DRAFT READY</div><h3>민원 초안도 함께 준비했어요.</h3><p class="sub">상태 요약 / 위치 / 요청 사항을 담았습니다.<br>다음 화면에서 내용을 직접 수정할 수 있어요.</p><div class="divider"></div><div class="summary-line"><span>작성 방식</span><strong>${esc(d.draft_source)}</strong></div><div class="summary-line"><span>사진 분석 방식</span><strong>${d.mode==='ai'?'실제 AI 응답':d.mode==='demo'?'정해진 시연 시나리오':'사용자 직접 확인'}</strong></div>${d.draft_warning?`<p class="helper">${esc(d.draft_warning)}</p>`:''}<button class="btn primary full mt16" onclick="go('review')">민원 내용 확인하기 ${icon('arrow')}</button></section></aside></div><div class="result-bottom"><button class="text-btn" onclick="go('start')">${icon('back')} 사진·상태 다시 확인하기</button><span class="inline-muted">아직 민원이 접수되지 않았습니다.</span></div>`;}
function reviewPage(){const d=S.draft,external=S.config.intake.enabled&&d.mode!=='demo'&&d.department.verified;return `<div class="hero"><div><div class="eyebrow">03 / REVIEW BEFORE SUBMISSION</div><h1 class="page-title">보내기 전, 내 말로 한 번 더 확인해요.</h1><p>내용을 수정할 수 있어요. 최종 접수는 직접 확인한 뒤 진행됩니다.</p></div></div>${steps(3)}<div class="review-grid"><section class="card form-section"><div class="card-head"><div><h2>민원 초안</h2><p class="sub">${esc(d.draft_source)} · 자유롭게 수정할 수 있어요</p></div><button class="text-btn" onclick="copyDraft()">${icon('copy')} 복사</button></div><div class="field"><label for="draft-title">제목</label><input id="draft-title" class="input" value="${esc(d.title)}" maxlength="200" oninput="S.draft.title=this.value"></div><div class="field"><label for="draft-text">내용</label><textarea id="draft-text" class="draft-editor" maxlength="10000" oninput="S.draft.text=this.value">${esc(d.text)}</textarea></div><div class="button-row"><button class="btn secondary small" onclick="copyDraft()">${icon('copy')} 민원 복사</button><button class="btn secondary small" onclick="downloadDraft()">${icon('download')} 문서 저장</button><button class="text-btn ml-auto" onclick="go('result')">진단 다시 보기</button></div></section><aside class="aside-stack"><section class="card card-pad"><h2>접수 정보</h2><div class="summary-line"><span>위치</span><strong>${esc(d.region)}<br>${esc(d.location)}</strong></div><div class="summary-line"><span>안내 부서</span><strong>${esc(d.department.department)}</strong></div><div class="summary-line"><span>첨부</span><strong>${d.mode==='demo'?'시연용 예시': '사진 1장'}</strong></div><div class="divider"></div><div class="field"><label for="submit-mode">접수 방식</label><select id="submit-mode" onchange="changeSubmitMode()"><option value="internal">${S.offline?'이 브라우저에 체험 기록 저장':'수거함 지킴이 서비스 내부 접수'}</option>${external?`<option value="external">${esc(S.config.intake.name)} 자동 접수</option>`:''}</select></div><div id="submit-notice" class="note warn">${S.offline?'브라우저에 체험 기록만 저장합니다. 실제 서버나 정부 기관에는 전송하지 않습니다.':'서비스 내부에만 저장합니다. 안전신문고 또는 구청에 공식 접수되는 것이 아닙니다.'}</div><div class="mt24"><label class="check-line"><input id="review-consent" type="checkbox" onchange="updateSubmit()"><span>사진·위치·민원 내용을 확인했으며, 사실과 다른 표현을 수정했습니다.</span></label><label class="check-line"><input id="storage-consent" type="checkbox" onchange="updateSubmit()"><span>${S.offline?'이 브라우저에 접수 내용이 저장되는':'사진과 민원 내용이 서비스에 최대 '+S.config.retention_days+'일 저장되는'} 것에 동의합니다.</span></label><label class="check-line hidden" id="external-line"><input id="external-consent" type="checkbox" onchange="updateSubmit()"><span id="external-consent-text"></span></label></div><button class="btn primary full mt24" id="submit-btn" onclick="submitReport()" disabled>${S.offline?'체험 기록 저장하기':'서비스에 접수하기'} ${icon('arrow')}</button><p class="helper" style="text-align:center;margin-top:12px">최종 버튼을 눌러야 접수가 시작됩니다.</p></section><section class="card card-pad"><h3>안전신문고에 직접 신고하려면</h3><p class="sub">민원 내용을 복사한 후 공식 사이트에서 사진을 첨부하고 제출하세요. 사이트를 여는 것만으로 접수되지는 않습니다.</p><button class="btn secondary full mt16" onclick="openOfficial()">안전신문고 열기 ${icon('external')}</button></section></aside></div>`;}
function statusLabel(r){if(r.status==='external_received')return r.external_scope==='government'?'공식 기관 접수 확인':'협업 기관 수신 확인';return {browser_saved:'로컬 체험 기록',internal_received:'서비스 내부 접수',delivery_pending:'기관 전송 결과 확인 중',delivery_unknown:'기관 수신 확인 필요',delivery_rejected:'기관 접수 거절'}[r.status]||'상태 확인 필요';}
function receiptPage(){const r=S.receipt,confirmed=r.status==='external_received',warn=['delivery_pending','delivery_unknown','delivery_rejected'].includes(r.status);return `<div class="hero"><div><div class="eyebrow">04 / RECEIPT & NEXT STEP</div><h1 class="page-title">제보의 다음 단계까지, 함께 확인해요.</h1><p>아래에 표시된 접수 범위와 처리 상태를 확인해 주세요.</p></div></div>${steps(4)}<section class="card receipt-card"><div class="receipt-icon">${icon(warn?'info':'check')}</div>${pill(statusLabel(r),warn?'warn':confirmed?'':'gray')}<h2 class="mt16">${r.status==='browser_saved'?'체험 기록을 저장했어요.':r.status==='internal_received'?'서비스에 제보를 남겼어요.':confirmed?'연계 기관이 접수를 확인했어요.':'기관 접수 결과를 확인해야 해요.'}</h2><p class="sub mt16">${esc(r.message)}</p><div class="receipt-number">${esc(r.id)}</div><p class="helper">${r.status==='browser_saved'?'브라우저 체험 번호 · 정부 접수번호 아님':'수거함 지킴이 내부 관리번호 · 정부 접수번호와 다릅니다'}</p><div class="receipt-meta"><div class="summary-line"><span>접수 제목</span><strong>${esc(r.title)}</strong></div><div class="summary-line"><span>위치</span><strong>${esc(r.region)} ${esc(r.location)}</strong></div><div class="summary-line"><span>저장 시각</span><strong>${esc(date(r.created))}</strong></div><div class="summary-line"><span>외부 수신 기관</span><strong>${esc(r.receiver||'전송하지 않음')}</strong></div><div class="summary-line"><span>기관 접수번호</span><strong>${esc(r.external_receipt||'없음 · 외부 접수 미확인')}</strong></div></div><div class="timeline">${(r.events||[]).map(e=>`<div class="timeline-item">${esc(e.text)}<small>${esc(date(e.at))}</small></div>`).join('')}</div>${!confirmed?`<div class="note warn mb24" style="text-align:left"><strong>정부 민원 접수 완료 상태가 아닙니다.</strong><br>${warn?'기관 확인 전 재전송하면 중복 접수가 될 수 있어요. 기존 접수 여부를 먼저 확인하세요.':'실제 신고가 필요하면 공식 신고 사이트에서 제출을 완료해 주세요.'}</div>`:''}<div class="button-row" style="justify-content:center"><button class="btn secondary" onclick="downloadReceipt()">${icon('download')} 접수 내역 저장</button>${!confirmed&&!warn?`<button class="btn primary" onclick="openOfficial()">공식 신고 사이트 열기 ${icon('external')}</button>`:`<button class="btn primary" onclick="refreshReceipt()">${icon('refresh')} 상태 새로고침</button>`}</div><div class="button-row mt24" style="justify-content:center"><button class="text-btn" onclick="openHistory()">내 접수 내역 보기</button><span class="inline-muted">·</span><button class="text-btn" onclick="resetForm()">새 제보 시작하기</button></div></section>`;}
function historyPage(){return `<div class="section-head"><div><div class="eyebrow">MY REPORTS</div><h1 class="page-title">내 접수 내역</h1><p class="sub">${S.offline?'현재 브라우저의 체험 기록입니다.':'이 브라우저에서 접수한 내역만 보입니다.'} ${S.config.retention_days}일 보관</p></div><button class="btn primary" onclick="resetForm()">${icon('plus')} 새 제보</button></div><div class="note mb24">${icon('lock')} 사진과 상세 위치는 공개 게시판에 표시하지 않습니다. ${S.offline?'로컬 기록은 서버로 전송되지 않습니다.':'다른 이용자의 접수 기록은 볼 수 없습니다.'}</div>${S.history.length?`<div class="history-list">${S.history.map(r=>`<button class="history-row" onclick="openReceipt('${esc(r.id)}')"><span class="status-icon">${icon('file')}</span><span class="grow"><strong>${esc(r.title)}</strong><small>${esc(r.id)} · ${esc(date(r.created))}</small></span>${pill(statusLabel(r),r.status.includes('unknown')?'warn':'gray')}${icon('arrow')}</button>`).join('')}</div><div class="button-row mt24"><button class="btn secondary small" onclick="openHistory()">${icon('refresh')} 새로고침</button><button class="text-btn ml-auto" onclick="deleteSelected()">최근 기록 삭제</button></div>`:`<section class="card empty"><div class="round-icon">${icon('file')}</div><h2>아직 접수한 내역이 없어요.</h2><p>사진으로 시작하거나 샘플을 통해 전체 흐름을 경험해 보세요.</p><button class="btn primary" onclick="useSample();go('start')">샘플로 시작하기 ${icon('arrow')}</button></section>`}`;}
function adminPage(){return `<div class="section-head"><div><div class="eyebrow">OPERATIONS</div><h1 class="page-title">운영자 접수함</h1><p class="sub">서비스에 저장된 제보 확인과 처리 메모를 남기는 공간입니다.</p></div></div>${S.offline?`<section class="card empty"><div class="round-icon">${icon('lock')}</div><h2>운영자 접수함은 서버 실행 모드에서 열려요.</h2><p>교체용 소스의 서버를 실행하고 운영자 토큰을 설정해 주세요.<br>로컬 체험 기록은 다른 사람에게 보이지 않습니다.</p><button class="btn secondary" onclick="go('start')">제보 화면으로 돌아가기</button></section>`:`<section class="card card-pad mb24"><h3>운영자 인증</h3><p class="sub mb16">토큰은 서버 환경변수 ADMIN_TOKEN에 설정합니다. 브라우저 저장소에는 보관하지 않습니다.</p><div class="button-row"><input id="admin-token" class="input admin-token" type="password" autocomplete="off" placeholder="운영자 토큰" style="flex:1;min-width:150px" value="${esc(S.adminToken)}" oninput="S.adminToken=this.value"><button class="btn primary" onclick="loadAdmin()">접수함 열기 ${icon('arrow')}</button></div></section><div class="note warn mb24">서비스 내부 접수 내역입니다. 메모를 남겨도 정부 접수·처리 완료 상태로 바뀌지 않습니다.</div>${S.adminReports.map(r=>`<section class="card admin-item"><div class="card-head"><h3>${esc(r.title)}</h3>${pill(statusLabel(r),'gray')}</div><div class="summary-line"><span>관리번호</span><strong>${esc(r.id)}</strong></div><div class="summary-line"><span>위치</span><strong>${esc(r.region)} ${esc(r.location)}</strong></div><details class="source"><summary>민원 내용과 처리 이력</summary><p style="white-space:pre-wrap">${esc(r.text)}</p>${(r.events||[]).map(e=>`<p>${esc(e.text)} · ${esc(date(e.at))}</p>`).join('')}</details><div class="button-row mt16"><input class="input" id="note-${esc(r.id)}" placeholder="처리 메모를 입력하세요" maxlength="600" style="flex:1;min-width:130px"><button class="btn secondary" onclick="addNote('${esc(r.id)}')">메모 저장</button></div></section>`).join('')}`}`;}
function render(){const pages={start:startPage,result:resultPage,review:reviewPage,receipt:receiptPage,history:historyPage,admin:adminPage};if(['result','review'].includes(S.page)&&!S.draft)S.page='start';if(S.page==='receipt'&&!S.receipt)S.page='start';document.getElementById('root').innerHTML=layout(pages[S.page]());bindDrop();}
function go(page){if(S.busy)return;S.error='';S.page=page;render();window.scrollTo({top:0,behavior:'smooth'});}
function resetForm(){if(S.busy)return;Object.assign(S,{page:'start',image:'',filename:'',sample:false,location:'',notes:'',selected:[],draft:null,receipt:null,error:'',aiConsent:false,idempotency:uid()});render();window.scrollTo(0,0);}
function setMode(mode){S.mode=mode;S.sample=false;S.draft=null;render();}
function toggleState(key,on){S.selected=on?[...new Set([...S.selected,key])]:S.selected.filter(k=>k!==key);if(on&&['normal','uncertain'].includes(key))S.selected=[key];else if(on)S.selected=S.selected.filter(k=>!['normal','uncertain'].includes(k));document.querySelectorAll('.check-chip input').forEach(el=>el.checked=S.selected.includes(el.value));}
function changeRegion(v){S.region=v;render();}
function useSample(){if(S.busy)return;Object.assign(S,{sample:true,mode:'demo',image:'',filename:'시연용 수거함 예시',region:'서울특별시 광진구',location:'자양동 시연용 골목 (가상 위치)',notes:'시연 예시입니다. 실제 민원이 아닙니다.',selected:['overflow','dumping'],draft:null,error:'',idempotency:uid()});if(S.page!=='start')S.page='start';render();toast('정해진 시연 시나리오를 불러왔어요.');}
function bindDrop(){const z=document.getElementById('drop-zone');if(!z)return;z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag')});z.addEventListener('dragleave',()=>z.classList.remove('drag'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag');loadFile(e.dataTransfer.files[0]);});}
async function loadFile(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))return error('JPG, PNG, WEBP 형식의 사진을 선택해 주세요.');if(file.size>10000000)return error('사진은 최대 10MB까지 올릴 수 있습니다.');busy(true,'사진을 준비하고 있어요','불필요한 사진 메타데이터를 제거합니다.');try{const data=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file);});const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=data;});if(img.naturalWidth*img.naturalHeight>25000000)throw new Error('사진 해상도가 너무 큽니다. 2,500만 화소 이하 사진을 선택해 주세요.');const scale=Math.min(1,1920/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);S.image=canvas.toDataURL('image/jpeg',.88);S.filename=file.name;S.sample=false;S.mode=S.config.ai_enabled?'ai':'manual';S.draft=null;S.idempotency=uid();S.error='';render();}catch(e){error(e.message||'사진을 읽을 수 없습니다. 다른 사진으로 시도해 주세요.');}finally{busy(false);}}
function normalize(states){const s=[...new Set(states)];return s.some(k=>!['normal','uncertain'].includes(k))?s.filter(k=>!['normal','uncertain'].includes(k)):s.includes('normal')?['normal']:['uncertain'];}
function localAnalyze(){const mode=S.sample?'demo':'manual',states=normalize(S.sample?['overflow','dumping']:S.selected),known=S.region.includes('광진구'),observations=mode==='demo'?['시연 시나리오: 투입구 주변에 의류가 쌓여 있습니다.','시연 시나리오: 수거함 옆에 봉투가 놓여 있습니다.']:states.map(k=>`제보자가 ${LABELS[k]} 상태를 직접 선택했습니다.`);const guidance=known?'광진구 안내에 따르면 의류수거함이 가득 찬 경우 수거함에 적힌 연락처 또는 청소과에 문의할 수 있습니다.':'이 지역의 검증된 담당 부서 자료가 아직 없습니다. 임의의 부서를 안내하지 않습니다.';const department={verified:known,department:known?'광진구청 청소과':'담당 부서 확인 필요',phone:known?'02-450-7624':'',guidance,channel_url:OFFICIAL,sources:known?[{title:'광진구청 · 폐의류 분리배출방법',url:SOURCE,checked:'2026-09-09',excerpt:guidance}]:[],ordinance:'관련 조례 원문 미등록 · 법 위반 여부를 판단하지 않습니다.',retrieval:'로컬 체험: 지역별 고정 공식 안내. 서버 실행 시 문자 벡터 검색.'};return {id:uid(),mode,region:S.region,location:S.location,notes:S.notes,states,observations,score:states.includes('uncertain')?null:Math.min(100,states.reduce((a,k)=>a+WEIGHTS[k],0)),score_note:'상태별 고정 가중치로 계산한 참고 점수이며 공인 위험도나 AI 확률이 아닙니다.',department,title:`${S.region} 의류수거함 현장 확인 및 관리 요청`,text:`[상태 요약]\n의류수거함의 ${states.map(k=>LABELS[k]).join(', ')} 상태에 대한 현장 확인을 요청드립니다.\n${observations.map(o=>'- '+o).join('\n')}\n(근거: ${mode==='demo'?'시연용 예시':'제보자 직접 확인'}, 현장 확인 필요)\n\n[위치]\n${S.region} ${S.location}\n\n[요청 사항]\n해당 위치의 수거함과 주변 환경을 확인하고, 필요한 수거·정비 및 관리주체 확인을 부탁드립니다.\n사진만으로 위법 여부나 관리 책임을 단정하지 않으며, 관할이 다른 경우 적절한 담당 부서 안내를 요청드립니다.${S.notes?'\n\n[제보자 추가 설명]\n'+S.notes:''}`,draft_source:'템플릿 자동 작성',draft_warning:'',created:new Date().toISOString()};}
async function analyze(){if(S.busy)return;if(!S.sample&&!S.image)return error('먼저 수거함 사진을 올려주세요.');if(S.region==='other'||S.region.trim().length<2||S.location.trim().length<2)return error('지역과 상세 위치를 입력해 주세요.');if(!S.sample&&S.mode==='manual'&&!S.selected.length)return error('사진에서 직접 확인한 상태를 하나 이상 선택해 주세요.');if(!S.sample&&S.mode==='ai'&&!S.aiConsent)return error('AI 사진 전송 동의가 필요합니다.');busy(true,S.sample?'샘플 흐름을 준비하고 있어요':S.mode==='ai'?'사진을 분석하고 있어요':'입력한 상태를 정리하고 있어요',S.sample?'실제 AI 호출이나 기관 접수는 하지 않습니다.':'담당 부서 자료와 민원 초안을 함께 준비합니다.');try{if(S.offline){S.draft=localAnalyze();}else{S.draft=await api('/api/analyze',{method:'POST',long:true,body:JSON.stringify({region:S.region.trim(),location:S.location.trim(),notes:S.notes,image:S.image,mode:S.sample?'demo':S.mode,states:S.selected,ai_consent:S.aiConsent})});}S.idempotency=uid();S.page='result';S.error='';render();window.scrollTo(0,0);}catch(e){error(e.message);}finally{busy(false);}}
async function copyText(text){try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('자동 복사가 제한되어 있습니다. 내용 선택 후 복사해 주세요.');}}
async function copyDraft(){const d=S.page==='receipt'?S.receipt:(S.draft||S.receipt);try{await copyText(d.title+'\n\n'+d.text);toast('민원 제목과 내용을 복사했어요.');}catch(e){toast(e.message);}}
function download(content,name,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadDraft(){const d=S.page==='receipt'?S.receipt:(S.draft||S.receipt);download('\ufeff'+d.title+'\n\n'+d.text,'수거함_민원초안.txt');toast('민원 초안을 파일로 저장했어요.');}
function downloadReceipt(){download(JSON.stringify(S.receipt,null,2),S.receipt.id+'.json','application/json');}
function openOfficial(){const w=window.open(OFFICIAL,'_blank','noopener,noreferrer');const d=S.page==='receipt'?S.receipt:(S.draft||S.receipt);if(d)copyText(d.title+'\n\n'+d.text).then(()=>toast('민원 내용을 복사했어요. 공식 사이트에서 사진 첨부 후 제출을 완료하세요.')).catch(()=>toast('공식 사이트에서 사진과 민원 내용을 넣고 제출을 완료하세요.'));else toast('공식 사이트에서 제출을 완료해야 실제 민원이 접수됩니다.');}
function changeSubmitMode(){const external=document.getElementById('submit-mode').value==='external';const n=document.getElementById('submit-notice');n.textContent=external?`${S.config.intake.name}에 사진·위치·민원 내용을 전송합니다. 기관 접수번호가 반환되어야 접수가 확인됩니다.`:S.offline?'브라우저에 체험 기록만 저장합니다. 실제 서버나 정부 기관에는 전송하지 않습니다.':'서비스 내부에만 저장합니다. 안전신문고 또는 구청에 공식 접수되는 것이 아닙니다.';document.getElementById('external-line').classList.toggle('hidden',!external);document.getElementById('external-consent-text').textContent=`${S.config.intake.name}에 사진·위치·민원 내용을 보내는 데 동의합니다.`;document.getElementById('external-consent').checked=false;document.getElementById('submit-btn').innerHTML=(external?'확인한 내용으로 기관 접수하기':S.offline?'체험 기록 저장하기':'서비스에 접수하기')+' '+icon('arrow');updateSubmit();}
function updateSubmit(){const external=document.getElementById('submit-mode').value==='external';document.getElementById('submit-btn').disabled=!(document.getElementById('review-consent').checked&&document.getElementById('storage-consent').checked&&(!external||document.getElementById('external-consent').checked));}
async function submitReport(){if(S.busy)return;const reviewed=document.getElementById('review-consent').checked,storage=document.getElementById('storage-consent').checked,mode=document.getElementById('submit-mode').value,ext=document.getElementById('external-consent').checked;if(!reviewed||!storage||(mode==='external'&&!ext))return error('필수 확인 항목에 동의해 주세요.');if(S.draft.title.trim().length<3||S.draft.text.trim().length<20)return error('민원 제목과 내용을 확인해 주세요.');busy(true,mode==='external'?'연계 기관에 접수를 요청하고 있어요':'접수 기록을 저장하고 있어요',mode==='external'?'중복 접수를 막기 위해 결과가 확인되기 전 다시 제출하지 마세요.':'서비스 접수와 공식 민원 접수는 구분됩니다.');try{if(S.offline){const existing=readLocal().find(r=>r.draft_id===S.draft.id);if(existing)S.receipt=existing;else{const now=new Date().toISOString();S.receipt={id:'DEMO-'+uid().slice(0,12).toUpperCase(),draft_id:S.draft.id,title:S.draft.title,text:S.draft.text,region:S.draft.region,location:S.draft.location,states:S.draft.states,score:S.draft.score,created:now,status:'browser_saved',external_receipt:null,external_scope:null,receiver:null,mode:S.draft.mode,message:'브라우저에 체험 기록만 저장했습니다. 실제 서버나 정부 기관에 전송하지 않았습니다.',events:[{at:now,text:'현재 브라우저에 로컬 체험 기록 저장'}]};saveLocal([S.receipt,...readLocal()]);}S.history=readLocal();}else{S.receipt=await api('/api/reports',{method:'POST',body:JSON.stringify({draft_id:S.draft.id,title:S.draft.title,text:S.draft.text,mode,reviewed,storage_consent:storage,external_consent:ext,idempotency_key:S.idempotency})});try{S.history=(await api('/api/reports')).reports;}catch{}}S.page='receipt';S.error='';render();window.scrollTo(0,0);}catch(e){error(e.message);}finally{busy(false);}}
async function openHistory(){if(S.busy)return;busy(true,'접수 내역을 확인하고 있어요','이 브라우저에서 남긴 내역만 불러옵니다.');try{S.history=S.offline?readLocal():(await api('/api/reports')).reports;S.page='history';S.error='';render();window.scrollTo(0,0);}catch(e){error(e.message);}finally{busy(false);}}
async function openReceipt(id){if(S.busy)return;try{S.receipt=S.offline?readLocal().find(r=>r.id===id):await api('/api/reports/'+encodeURIComponent(id));if(!S.receipt)throw new Error('접수 내역을 찾지 못했습니다.');S.page='receipt';S.error='';render();window.scrollTo(0,0);}catch(e){error(e.message);}}
async function refreshReceipt(){await openReceipt(S.receipt.id);toast('현재 저장된 접수 상태를 확인했어요.');}
async function deleteSelected(){if(!S.history.length)return;const r=S.history[0];if(!confirm(`최근 기록 ${r.id}를 삭제할까요? 이 서비스에서만 삭제되며 외부 기관의 민원은 취소되지 않습니다.`))return;try{if(S.offline)saveLocal(readLocal().filter(x=>x.id!==r.id));else await api('/api/reports/'+encodeURIComponent(r.id),{method:'DELETE',body:'{}'});await openHistory();toast('서비스의 접수 기록을 삭제했어요.');}catch(e){error(e.message);}}
function openAdmin(){go('admin');}
async function loadAdmin(){if(S.busy)return;busy(true,'운영자 접수함을 열고 있어요');try{S.adminReports=(await api('/api/admin/reports',{headers:{Authorization:'Bearer '+S.adminToken}})).reports;S.error='';render();}catch(e){error(e.message);}finally{busy(false);}}
async function addNote(id){const note=document.getElementById('note-'+id).value;if(note.trim().length<2)return toast('두 글자 이상 입력해 주세요.');try{await api('/api/admin/reports/'+encodeURIComponent(id)+'/notes',{method:'POST',headers:{Authorization:'Bearer '+S.adminToken},body:JSON.stringify({note})});await loadAdmin();toast('운영자 메모를 저장했어요.');}catch(e){error(e.message);}}
function privacy(){document.getElementById('privacy-body').innerHTML=`<p><strong>어떤 정보를 사용하나요?</strong><br>수거함 사진, 입력한 지역·위치, 상태 확인 내용과 민원 문구를 사용합니다. 이름, 휴대전화, 주민등록번호를 입력받지 않습니다. 거주지 주소가 아니라 수거함의 위치를 적어주세요.</p><p><strong>사진은 어떻게 처리되나요?</strong><br>이미지를 다시 저장해 EXIF와 GPS 메타데이터를 제거합니다. 얼굴·차량번호는 자동으로 가려지지 않으므로 먼저 가려주세요. AI 모드에서만 별도 동의 후 연결된 AI 제공자에게 사진을 보냅니다.</p><p><strong>어디에 저장되나요?</strong><br>${S.offline?'지금은 로컬 체험 모드입니다. 사진은 저장하지 않으며 민원 텍스트와 체험 내역만 현재 브라우저 저장소에 저장합니다. 7일을 지난 기록은 목록에서 제외합니다. 서버로 전송하지 않습니다.':`서버 실행 모드에서는 사진과 민원 내용이 최대 ${S.config.retention_days}일간 로컬 데이터베이스에 저장됩니다. 접속·분석·조회 시 만료 데이터를 정리합니다. 같은 브라우저와 인증된 운영자만 접수 내역을 확인할 수 있습니다.`}</p><p><strong>정부에 바로 신고되나요?</strong><br>서비스 내부 접수는 정부 민원 접수가 아닙니다. 승인된 외부 연계가 설정된 경우에만 별도 동의 후 전송합니다. 수신 기관의 접수번호가 확인되어야 외부 접수로 표시합니다.</p><p><strong>운영 전 점검</strong><br>공개 운영에는 운영 주체의 실제 개인정보 처리방침, 보관·삭제 정책, HTTPS, 접수기관 협의와 접근통제 점검이 추가로 필요합니다.</p>`;document.getElementById('privacy').showModal();}
async function init(){render();if(S.offline){S.loadingConfig=false;S.ready=true;S.history=readLocal();render();return;}try{S.config=await api('/api/config');S.ready=true;S.mode=S.config.ai_enabled?'ai':'manual';try{S.history=(await api('/api/reports')).reports;}catch{}}catch(e){S.error='백엔드에 연결할 수 없습니다. 서버 실행 방법을 확인해 주세요. 체험 화면은 주소 끝에 ?demo=1을 붙이면 열립니다.';}finally{S.loadingConfig=false;render();}}
window.addEventListener('beforeunload',e=>{if(S.busy){e.preventDefault();e.returnValue='';}});
init();
</script>
